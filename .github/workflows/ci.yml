# CI y deploy.
# - verify: en cada PR y push a develop/main. El ruleset exige que pase para mergear.
# - deploy: solo en push a main (al mergear un PR) y solo si verify pasó.
#   Publica el Worker y la PWA con las credenciales del environment `production`,
#   que GitHub entrega únicamente a jobs que corren sobre main.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  # En PRs se cancela la corrida vieja; en develop/main no, para no cortar un deploy a la mitad.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Toma la versión de pnpm de "packageManager" en package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Un cambio en schema.ts sin su migración generada hace fallar el CI
      - name: Migraciones al día con el schema
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate
          git diff --exit-code -- migrations || (echo "::error::Falta generar la migración: pnpm --filter @meta31/db generate" && exit 1)
          test -z "$(git status --porcelain -- migrations)" || (echo "::error::Falta generar la migración: pnpm --filter @meta31/db generate" && exit 1)

      - name: Build del Worker (dry-run, controla el tamaño del bundle)
        run: pnpm --filter @meta31/worker run build

      - name: Build de la PWA
        run: pnpm --filter @meta31/web build
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci
          VITE_API_URL: https://ci.workers.dev

  deploy:
    name: deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://meta31.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Primero el Worker: la PWA nueva puede depender de rutas nuevas de la API.
      - name: Deploy del Worker
        run: pnpm --filter @meta31/worker run deploy

      - name: Build de la PWA
        run: pnpm --filter @meta31/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy de la PWA (Cloudflare Pages)
        working-directory: apps/worker
        run: pnpm exec wrangler pages deploy ../web/dist --project-name meta31 --branch main --commit-hash ${{ github.sha }}
