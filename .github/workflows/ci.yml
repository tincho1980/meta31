# CI and deploy.
# - verify: on every PR and push to develop/main. The ruleset requires it to pass before merging.
# - deploy: only on push to main (when a PR is merged) and only if verify passed.
#   Publishes the Worker and the PWA with the credentials of the `production` environment,
#   which GitHub only hands to jobs running on main.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  # On PRs the old run is cancelled; on develop/main it is not, so a deploy is never cut in half.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Takes the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # A schema.ts change without its generated migration fails the CI
      - name: Migrations in sync with the schema
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate
          git diff --exit-code -- migrations || (echo "::error::Migration not generated: pnpm --filter @meta31/db generate" && exit 1)
          test -z "$(git status --porcelain -- migrations)" || (echo "::error::Migration not generated: pnpm --filter @meta31/db generate" && exit 1)

      - name: Worker build (dry-run, checks the bundle size)
        run: pnpm --filter @meta31/worker run build

      - name: PWA build
        run: pnpm --filter @meta31/web build
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci
          VITE_API_URL: https://ci.workers.dev

  deploy:
    name: deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://meta31.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Worker first: the new PWA may depend on new API routes.
      - name: Deploy Worker
        run: pnpm --filter @meta31/worker run deploy

      - name: PWA build
        run: pnpm --filter @meta31/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy PWA (Cloudflare Pages)
        working-directory: apps/worker
        run: pnpm exec wrangler pages deploy ../web/dist --project-name meta31 --branch main --commit-hash ${{ github.sha }}
