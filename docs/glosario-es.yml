# Textos de la interfaz que no son tablas, columnas ni enums.
# Admiten variables entre llaves: {name}, {email}.
ui:
  app_name: Meta31
  tagline: Llegar al 31 con lo que queda.
  loading: Cargando…
  sign_in_with_google: Ingresar con Google
  sign_out: Salir
  greeting: Hola, {name}
  not_authorized: "La cuenta {email} no está habilitada."
  error_generic: No se pudo conectar con el servidor.

  # Navegación (manual de marca: barra inferior en el celular, barra lateral en desktop)
  nav_main: Principal
  nav_month: Mes
  nav_projection: Proyección
  nav_load: Cargar
  nav_inbox: Bandeja
  nav_more: Más
  nav_what_we_have: Lo que tenemos
  nav_cards: Tarjetas
  nav_loans: Préstamos
  nav_properties: Propiedades
  nav_incomes: Ingresos
  nav_recurring_expenses: Gastos recurrentes
  nav_settings: Configuración
  load_intro: ¿Qué querés cargar?
  more_intro: Datos de base que usan las proyecciones.
  pending_screen: Esta pantalla todavía no está. Viene en las próximas entregas.
  rates_updated: "act. {date}"

  # Acciones
  add: Agregar
  save: Guardar
  cancel: Cancelar
  edit: Editar
  deactivate: Desactivar
  delete: Borrar
  confirm_delete: "¿Borrar «{name}»? No se puede deshacer."
  activate: Activar
  saving: Guardando…
  empty_list: Todavía no hay nada cargado.
  inactive: Inactiva
  system: Del sistema
  system_category_help: "La usa el sistema y no se puede modificar: «Tarjetas de crédito» para el pago de los resúmenes, «Alquileres» para reconocer los alquileres."
  no_holder: Sin titular
  no_property: Sin propiedad
  open_ended: Sin fecha de fin
  until_month: "hasta {month}"
  since_month: "desde {month}"
  every_months_1: Mensual
  every_months_2: Bimestral
  every_months_3: Trimestral
  every_months_6: Semestral
  every_months_12: Anual
  anchor_month_help: Uno de los meses en que se cobra; los demás salen de la frecuencia.
  valid_to_help: Último mes en que rige. Vacío si no tiene fin.
  no_beneficiary: Sin destinatario
  first_estimated_amount: Monto estimado inicial
  due_on_day: "vence el {day}"
  recurring_expense_help: Servicios, impuestos, expensas y lo que se paga todos los meses fuera de la tarjeta. Lo que se paga con tarjeta va en el resumen, no acá.
  expense_amount_help: El monto estimado se mantiene hasta que cargás uno nuevo con el mes desde el que rige (aumentos de tarifa, revalúos).
  estimated_spend: Consumo estimado por mes
  estimated_spend_help: Lo que se gasta por mes con la tarjeta además de las cuotas y suscripciones. Sirve para estimar los resúmenes futuros hasta que llega el real.
  card_currency_help: Las tarjetas argentinas se pagan en pesos argentinos y la uruguaya en pesos uruguayos, incluida la parte en dólares.
  closes_on_day: "cierra el {day}"
  one_off_expense_help: Compras o pagos que no se repiten, en un pago o en cuotas, fuera de la tarjeta. Si va con tarjeta, se carga como compra en cuotas de la tarjeta.
  one_off_edit_help: Las cuotas de los meses ya abiertos o pagados conservan su monto; el cambio vale para las que faltan.
  single_payment: Un pago
  installments_of: "{n} cuotas de {amount}"
  period_range: "{from} a {to}"
  income_amount_help: El monto se mantiene hasta que cargás uno nuevo con el mes desde el que rige (aumentos, actualizaciones de alquiler).
  first_amount: Monto inicial
  new_amount: Nuevo monto
  amounts: Montos
  close: Cerrar
  exchange_rate_help: "Cuántas unidades de moneda local vale un dólar, desde la fecha indicada. Puede ser retroactiva: las proyecciones se recalculan desde esa fecha, los pagos ya hechos no."

  # Errores de la API (código → texto)
  error_not_found: No se encontró el registro.
  error_conflict: El dato choca con uno existente.
  error_duplicate_name: Ya existe una con ese nombre.
  error_duplicate_date: Ya hay una cotización de ese par en esa fecha.
  error_category_kind: La categoría tiene que ser de ingresos.
  error_invalid_reference: Uno de los datos elegidos ya no existe. Recargá la pantalla.
  error_valid_to_before_valid_from: El fin no puede ser anterior al inicio.
  error_no_amount_at_start: El primer mes tiene que tener un monto. Corregí el historial de montos.
  error_duplicate_period: Ya hay un monto que rige desde ese mes.
  error_has_stored_commitments: Ya tiene compromisos grabados (mes abierto o pagado). Anulalos desde la vista del mes; acá podés editarlo o ponerle fecha de fin.
  error_planned_date_month: La fecha prevista tiene que caer en el mes del primer pago.
  error_card_payment_category: Esa categoría es la del pago de las tarjetas; elegí otra.
  error_system_category: Es una categoría del sistema y no se puede modificar.
  error_validation: Revisá los datos marcados.

  # Validación de campos (código → texto)
  invalid_required: Obligatorio.
  invalid_decimal: Número inválido. Usá coma para los decimales (montos con hasta 2).
  invalid_must_be_positive: Tiene que ser mayor que cero.
  invalid_date: Fecha inválida.
  invalid_choice: Elegí una opción.
  invalid_period: Tiene que ser un mes (día 1).
  invalid_day: Un día entre 1 y 31 (31 = último día del mes).
  invalid_range: No puede ser anterior al inicio.
  invalid_month_mismatch: Tiene que caer en el mes del primer pago.
  invalid_installments: Entre 1 y 120 cuotas.
  invalid_empty: No hay cambios para guardar.
  invalid_default: Valor inválido.

